[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merapy-taskqueue"
version = "0.1.0"
description = "Standalone async Python task queue with pluggable storage backends and embedded Preact real-time dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Dimas Santoso", email = "santoso.db@gmail.com" }]
keywords = ["task-queue", "worker", "asyncio", "graphql", "dashboard", "fastapi", "merapy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "strawberry-graphql>=0.236",
]

[project.optional-dependencies]
sql = ["sqlalchemy[asyncio]>=2.0"]
mongo = ["motor>=3.6"]
redis = ["redis>=5.0"]
metrics = ["psutil>=5.9"]
all = [
    "sqlalchemy[asyncio]>=2.0",
    "motor>=3.6",
    "redis>=5.0",
    "psutil>=5.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"merapy_taskqueue" = ["py.typed", "dashboard_static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
