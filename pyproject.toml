[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merapy"
version = "0.1.0"
description = "Python clean-architecture microservice framework — port of Go candi (golangid/candi)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dimas Santoso", email = "santoso.db@gmail.com" }]
keywords = ["framework", "microservice", "fastapi", "litestar", "clean-architecture", "candi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115",
    "litestar>=2.12",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "motor>=3.6",
    "redis>=5.0",
    "aiokafka>=0.11",
    "aio-pika>=9.4",
    "croniter>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jsonschema>=4.22",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "cryptography>=43.0",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "strawberry-graphql>=0.236",
    "click>=8.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
merapy = "merapy.cli.__main__:cli"

[project.urls]
Homepage = "https://github.com/dimassantoso/merapy"
Repository = "https://github.com/dimassantoso/merapy"
"Bug Tracker" = "https://github.com/dimassantoso/merapy/issues"
Changelog = "https://github.com/dimassantoso/merapy/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"merapy.cli" = ["templates/**/*"]
"merapy.codebase.app.task_queue_worker" = ["dashboard_static/**/*"]
"merapy" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RET", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_unimported = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "aio_pika.*", "motor.*", "croniter.*", "strawberry.*", "grpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
