name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: merapy-linux-x86_64
          - os: macos-latest
            target: merapy-macos-arm64
          - os: windows-latest
            target: merapy-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and release tools
        run: |
          pip install "merapy-taskqueue @ git+https://github.com/dimassantoso/merapy-taskqueue.git"
          pip install -e ".[release]"

      - name: Build standalone CLI binary
        run: python scripts/build_binary.py --output-dir release --name ${{ matrix.target }}

      - name: Smoke test binary
        shell: bash
        run: |
          ./release/${{ matrix.target }} --version
          ./release/${{ matrix.target }} --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/${{ matrix.target }}

  build-dist:
    name: Build Python wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: pip install build twine

      - name: Build wheel + sdist
        run: python -m build --outdir release

      - name: Verify distributions
        run: twine check release/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: release/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-dist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
